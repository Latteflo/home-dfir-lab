# Detection: Sudo Privilege Escalation
# MITRE ATT&CK: T1548.003 — Abuse Elevation Control Mechanism: Sudo and Sudo Caching
# Sourcetype: linux_secure (auth logs)
# Trigger: Any sudo command executed as root — especially shells or sensitive binaries

[sudo_escalation]
action.email.useNSSubject = 1
alert.severity = 2
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
description = Detects privilege escalation via sudo to root. Alerts on any sudo \
  session opened as root, with additional focus on high-risk commands: /bin/bash, \
  /bin/sh, /usr/bin/passwd, /usr/bin/python*, visudo, and chmod/chown on system paths. \
  Legitimate admin activity may trigger this rule — correlate with user context.
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=main sourcetype=linux_secure \
  "sudo" "USER=root" \
  | rex field=_raw "COMMAND=(?<command>.+)$" \
  | eval is_high_risk=if(match(command, "(\/bin\/bash|\/bin\/sh|passwd|python|visudo|chmod|chown)"), "yes", "no") \
  | table _time, host, is_high_risk, command \
  | sort -_time
