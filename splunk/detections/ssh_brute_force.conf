# Detection: SSH Brute Force
# MITRE ATT&CK: T1110.001 — Brute Force: Password Guessing
# Sourcetype: linux_secure (auth logs)
# Trigger: 5+ failed SSH login attempts from the same source IP within 5 minutes

[ssh_brute_force]
action.email.useNSSubject = 1
alert.severity = 3
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
description = Detects repeated SSH authentication failures from a single source IP, \
  indicating a brute force or password spraying attack. Threshold of 5 failures \
  in 5 minutes is intentionally low for a home lab; raise to 10-20 in production.
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
quantity = 5
relation = greater than
search = index=main sourcetype=linux_secure \
  ("Failed password" OR "authentication failure") \
  ("ssh2" OR "sshd") \
  | rex field=_raw "from (?<src_ip>\d+\.\d+\.\d+\.\d+)" \
  | stats count by src_ip \
  | where count >= 5
