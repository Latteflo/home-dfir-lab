# Detection: Repeated Failed Logins (Any Method)
# MITRE ATT&CK: T1078 — Valid Accounts (detection of account abuse / enumeration)
# Sourcetype: linux_secure (auth logs)
# Trigger: 3+ failed login attempts for the same username within 10 minutes,
#           regardless of source (covers local, SSH, PAM-based logins)

[repeated_failed_logins]
action.email.useNSSubject = 1
alert.severity = 2
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */10 * * * *
description = Detects repeated authentication failures targeting a specific user \
  account, regardless of login method (SSH, su, PAM, console). This is broader than \
  the SSH brute force rule — it catches local privilege escalation attempts and \
  account enumeration. Failures against 'root' or 'admin' are highest priority.
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
quantity = 3
relation = greater than
search = index=main sourcetype=linux_secure \
  ("Failed password" OR "authentication failure" OR "FAILED LOGIN" OR "Invalid user") \
  | rex field=_raw "for (?:invalid user )?(?<username>\w+)" \
  | rex field=_raw "user=(?<u2>\w+)" \
  | eval username=coalesce(username,u2) \
  | where isnotnull(username) AND username!="" \
  | stats count by username \
  | where count >= 3 \
  | eval priority=if(match(username, "^(root|admin|administrator)$"), "HIGH", "MEDIUM") \
  | sort -count
